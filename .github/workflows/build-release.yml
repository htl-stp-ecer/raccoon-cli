name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Release: tag, GitHub release, PyPI and notify the other repositories. Untick to only build and test (also works on a branch)."
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

# One release at a time: the number is decided at the start of the run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release number: one more than the highest number that already exists, as a
  # tag v<number> and on PyPI (raccoon-cli). github.run_number also counts every pull request and
  # every cancelled run, which leaves gaps.
  version:
    name: Release number
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.release)
    outputs:
      number: ${{ steps.next.outputs.number }}
    steps:
      - name: Next release number
        id: next
        env:
          PYPI_PACKAGES: "raccoon-cli"
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          numbers = []

          tags = subprocess.run(
              ["git", "ls-remote", "--tags", f"https://github.com/{repo}.git"],
              check=True, capture_output=True, text=True,
          ).stdout
          for line in tags.splitlines():
              match = re.search(r"refs/tags/v(\d+)$", line)
              if match:
                  numbers.append(int(match.group(1)))

          # A number that is on PyPI can never be used again, even if the run that
          # uploaded it failed before it created a tag.
          for package in os.environ["PYPI_PACKAGES"].split():
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json") as response:
                  numbers += [int(v) for v in json.load(response)["releases"] if v.isdigit()]

          if not numbers:
              raise SystemExit("no earlier release number found")
          number = max(numbers) + 1
          print(f"next release number: {number}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"number={number}\n")
          PY

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/raccoon-cli-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify raccoon HAL stubs are available
        run: python3 -c "import raccoon.hal; print('raccoon.hal OK')"

      - name: Install raccoon-cli
        run: pip3 install -e . -q

      - name: Run tests
        run: python3 -m pytest tests/ -x -q --tb=short

  build-and-release:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clean submodule directories
        run: rm -rf web-ide

      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # The same script that builds locally: wheel incl. web IDE, written to builds/.
      - name: Build
        run: python3 build.py --version ${{ needs.version.outputs.number }}

      - name: Resolve artifact filenames
        id: artifacts
        run: echo "raccoon_whl=$(basename builds/raccoon_cli-*.whl)" >> "$GITHUB_OUTPUT"

      # --- Create GitHub Release ---
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.number }}
          name: v${{ needs.version.outputs.number }}
          generate_release_notes: true
          body: |
            ## Install

            ### Laptop

            Via `gh` CLI:
            ```bash
            gh release download v${{ needs.version.outputs.number }} -R ${{ github.repository }} -p "*.whl"
            pip install ${{ steps.artifacts.outputs.raccoon_whl }}
            ```

            Or if you downloaded the `.whl` file manually:
            ```bash
            pip install ${{ steps.artifacts.outputs.raccoon_whl }}
            ```

            `raccoon-transport` is installed from PyPI as a dependency.

            ### Pi server

            `raccoon update` installs it on the Pi (from PyPI).
          files: builds/raccoon_cli-*.whl

      # raccoon-image keeps its dev manifest (bundles/dev.json) up to date from this.
      # The pins in raccoon-example no longer follow single releases: only Create
      # Bundle in raccoon-image moves them.
      - name: Create an app token for raccoon-image
        id: image-token
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
        # The release is already published at this point; never fail the job (and with it
        # the PyPI upload that needs it) because the bundle could not be notified.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: htl-stp-ecer
          repositories: raccoon-image
          permission-contents: write

      - name: Trigger raccoon-image bundle
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          TOKEN: ${{ steps.image-token.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::no app token; raccoon-image was not notified"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/htl-stp-ecer/raccoon-image/dispatches \
            -d '{"event_type":"component-released","client_payload":{"component":"raccoon-cli","version":"${{ needs.version.outputs.number }}"}}' \
            || echo "::warning::could not notify raccoon-image"

      # --- Upload wheel as artifact for the publish job ---
      - name: Upload raccoon-cli wheel
        uses: actions/upload-artifact@v7
        with:
          name: raccoon-cli-wheel
          path: builds/raccoon_cli-*.whl

  publish-pypi:
    needs: build-and-release
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for PyPI Trusted Publishing

    steps:
      - name: Download raccoon-cli wheel
        uses: actions/download-artifact@v5
        with:
          name: raccoon-cli-wheel
          path: dist/

      - name: Publish raccoon-cli to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

